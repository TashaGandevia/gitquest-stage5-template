# Moves the mission on: starts it, reacts to merged pull requests, fault
# reports and pushes to main. Station commits are made with GITHUB_TOKEN, which
# doesn't trigger further workflow runs, so there are no loops.
name: Station control

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [closed]
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

# One station decision at a time: each run reads and rewrites the progress file.
concurrency:
  group: station-control
  cancel-in-progress: false

jobs:
  station:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      # Always run the station's code from the default branch, never a PR's.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/station.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
